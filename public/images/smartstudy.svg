<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000f0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001a10;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0" />
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="600" cy="320" rx="340" ry="240" fill="url(#glow)" filter="url(#blur)"/>
  <!-- Book icon -->
  <rect x="470" y="190" width="120" height="170" rx="4" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <rect x="610" y="190" width="120" height="170" rx="4" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <line x1="590" y1="190" x2="590" y2="360" stroke="#10b981" stroke-width="3"/>
  <line x1="610" y1="190" x2="610" y2="360" stroke="#10b981" stroke-width="3"/>
  <!-- Lines on book -->
  <g stroke="#34d399" stroke-width="1.5" opacity="0.7">
    <line x1="490" y1="225" x2="570" y2="225"/>
    <line x1="490" y1="248" x2="570" y2="248"/>
    <line x1="490" y1="271" x2="570" y2="271"/>
    <line x1="490" y1="294" x2="570" y2="294"/>
    <line x1="630" y1="225" x2="710" y2="225"/>
    <line x1="630" y1="248" x2="710" y2="248"/>
    <line x1="630" y1="271" x2="710" y2="271"/>
    <line x1="630" y1="294" x2="710" y2="294"/>
  </g>
  <!-- Quiz cards floating -->
  <rect x="200" y="240" width="180" height="80" rx="12" fill="#052e16" stroke="#10b981" stroke-width="1.5" opacity="0.7" transform="rotate(-8, 290, 280)"/>
  <text x="290" y="273" text-anchor="middle" font-family="monospace" font-size="13" fill="#6ee7b7" transform="rotate(-8, 290, 280)">Q: What is React?</text>
  <text x="290" y="295" text-anchor="middle" font-family="monospace" font-size="11" fill="#10b981" transform="rotate(-8, 290, 280)">? A JavaScript Library</text>
  <rect x="820" y="260" width="180" height="80" rx="12" fill="#052e16" stroke="#10b981" stroke-width="1.5" opacity="0.7" transform="rotate(6, 910, 300)"/>
  <text x="910" y="293" text-anchor="middle" font-family="monospace" font-size="13" fill="#6ee7b7" transform="rotate(6, 910, 300)">Score: 92%</text>
  <text x="910" y="315" text-anchor="middle" font-family="monospace" font-size="11" fill="#10b981" transform="rotate(6, 910, 300)">?? Excellent!</text>
  <!-- Tags -->
  <g font-family="monospace" font-size="14">
    <rect x="280" y="530" width="120" height="28" rx="14" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="340" y="549" text-anchor="middle" fill="#6ee7b7">JavaScript</text>
    <rect x="416" y="530" width="100" height="28" rx="14" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="466" y="549" text-anchor="middle" fill="#6ee7b7">React</text>
    <rect x="532" y="530" width="140" height="28" rx="14" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="602" y="549" text-anchor="middle" fill="#6ee7b7">Node.js</text>
    <rect x="688" y="530" width="120" height="28" rx="14" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="748" y="549" text-anchor="middle" fill="#6ee7b7">Quiz App</text>
  </g>
  <text x="600" y="612" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700" fill="white">SMART STUDY</text>
  <text x="600" y="648" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#6ee7b7">Student Learning &amp; Quiz Platform</text>
</svg>
