<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00050f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a001a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0" />
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="600" cy="300" rx="380" ry="260" fill="url(#glow)" filter="url(#blur)"/>
  <!-- Movie thumbnails in background -->
  <g opacity="0.18">
    <rect x="80" y="180" width="150" height="220" rx="8" fill="#4c1d95"/>
    <rect x="250" y="180" width="150" height="220" rx="8" fill="#3730a3"/>
    <rect x="800" y="180" width="150" height="220" rx="8" fill="#4c1d95"/>
    <rect x="970" y="180" width="150" height="220" rx="8" fill="#3730a3"/>
  </g>
  <!-- Play button icon -->
  <circle cx="600" cy="290" r="80" fill="#1e0a3c" stroke="#8b5cf6" stroke-width="3"/>
  <polygon points="580,252 648,290 580,328" fill="#c4b5fd"/>
  <!-- Screen/TV frame -->
  <rect x="370" y="180" width="460" height="280" rx="16" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  <rect x="560" y="460" width="80" height="20" rx="4" fill="#8b5cf6" opacity="0.5"/>
  <rect x="480" y="480" width="240" height="8" rx="4" fill="#8b5cf6" opacity="0.3"/>
  <!-- Tags -->
  <g font-family="monospace" font-size="14" fill="#8b5cf6">
    <rect x="220" y="530" width="100" height="28" rx="14" fill="#1e0a3c" stroke="#8b5cf6" stroke-width="1"/>
    <text x="270" y="549" text-anchor="middle" fill="#c4b5fd">React</text>
    <rect x="336" y="530" width="120" height="28" rx="14" fill="#1e0a3c" stroke="#8b5cf6" stroke-width="1"/>
    <text x="396" y="549" text-anchor="middle" fill="#c4b5fd">Node.js</text>
    <rect x="472" y="530" width="140" height="28" rx="14" fill="#1e0a3c" stroke="#8b5cf6" stroke-width="1"/>
    <text x="542" y="549" text-anchor="middle" fill="#c4b5fd">Express</text>
    <rect x="628" y="530" width="140" height="28" rx="14" fill="#1e0a3c" stroke="#8b5cf6" stroke-width="1"/>
    <text x="698" y="549" text-anchor="middle" fill="#c4b5fd">MongoDB</text>
    <rect x="784" y="530" width="140" height="28" rx="14" fill="#1e0a3c" stroke="#8b5cf6" stroke-width="1"/>
    <text x="854" y="549" text-anchor="middle" fill="#c4b5fd">JavaScript</text>
  </g>
  <text x="600" y="612" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="white">OTT STREAMING PLATFORM</text>
  <text x="600" y="648" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#a78bfa">Full-Stack Streaming Experience</text>
</svg>
